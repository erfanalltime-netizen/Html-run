<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- viewport-fit=cover is essential for removing black bars on notch phones -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ultimate Full Screen Runner</title>

    <!-- CodeMirror (Offline) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/css/css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/htmlmixed/htmlmixed.min.js"></script>

    <style>
        :root { --primary: #6200EE; --bg: #F5F5F5; }
        
        /* Reset margins and force full height */
        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: var(--bg);
            overflow: hidden;
            -webkit-user-select: none; /* Disable selection outside editor */
        }

        /* --- Main Layout --- */
        .app-container { display: flex; flex-direction: column; height: 100vh; width: 100vw; }

        /* --- Header --- */
        .app-bar {
            height: 50px; background: white; display: flex; align-items: center;
            padding: 0 10px; border-bottom: 1px solid #ddd; z-index: 10;
        }
        .tabs-wrapper { flex: 1; display: flex; overflow-x: auto; scrollbar-width: none; }
        .tabs-wrapper::-webkit-scrollbar { display: none; }
        .tab-chip {
            background: #eee; padding: 5px 12px; margin-right: 5px;
            border-radius: 15px; font-size: 12px; white-space: nowrap; cursor: pointer;
            display: flex; align-items: center;
        }
        .tab-chip.active { background: #e8eaf6; color: var(--primary); font-weight: bold; }
        .add-icon { font-size: 22px; padding: 0 10px; color: var(--primary); border: none; background: none; }

        /* --- Editor --- */
        #editor-area { flex: 1; position: relative; }
        .CodeMirror { height: 100%; font-size: 14px; }

        /* --- Run Button --- */
        .run-btn {
            position: absolute; bottom: 20px; right: 20px;
            width: 55px; height: 55px; background: var(--primary);
            border-radius: 50%; color: white; border: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 20;
            display: flex; justify-content: center; align-items: center;
        }

        /* --- Tools --- */
        .bottom-tools { height: 45px; background: white; border-top: 1px solid #ddd; display: flex; justify-content: space-around; align-items: center; }
        .tool-btn { background: none; border: none; padding: 5px; color: #555; }

        /* --- FULL SCREEN OVERLAY --- */
        #run-overlay {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: #ffffff; /* White background to cover everything */
            z-index: 2147483647; /* Max Z-Index */
            display: none;
        }

        iframe { border: none; width: 100%; height: 100%; display: block; background: #fff; }

        /* --- INVISIBLE TOP TRIGGER & HANDLE --- */
        .menu-trigger-zone {
            position: absolute; top: 0; left: 0; width: 100%; height: 30px;
            z-index: 2147483648;
            display: flex; justify-content: center;
        }
        
        .menu-handle {
            width: 60px; height: 6px;
            background: rgba(0,0,0,0.1); /* Very subtle */
            border-radius: 0 0 10px 10px;
            cursor: pointer; transition: 0.3s;
        }
        .menu-trigger-zone:hover .menu-handle, 
        .menu-trigger-zone:active .menu-handle {
            height: 25px; background: rgba(0,0,0,0.6);
        }
        .menu-handle::after {
            content: ''; display: block; width: 20px; height: 3px;
            background: white; margin: 0 auto; margin-top: 2px;
            border-radius: 2px; opacity: 0.8;
        }

        /* --- CONTROL PANEL --- */
        .control-panel {
            position: absolute; top: 50px; left: 50%; transform: translateX(-50%);
            width: 85%; max-width: 320px;
            background: rgba(255,255,255,0.95); backdrop-filter: blur(5px);
            padding: 20px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            display: none; flex-direction: column; gap: 15px; z-index: 2147483649;
        }
        .control-panel.show { display: flex; }
        
        .btn-row { display: flex; gap: 10px; }
        .c-btn { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: bold; }
        .bg-red { background: #ffebee; color: #c62828; }
        .bg-blue { background: #e3f2fd; color: #1565c0; }
        
        select { padding: 10px; border-radius: 8px; border: 1px solid #ccc; width: 100%; }
        #console-box { background: #222; color: #0f0; padding: 10px; height: 80px; overflow-y: auto; font-size: 11px; display: none; border-radius: 5px; }
        .backdrop { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.4); z-index:2147483648; display:none; }

    </style>
</head>
<body>
    <div class="app-container">
        <div class="app-bar">
            <div class="tabs-wrapper" id="tabs-container"></div>
            <button class="add-icon" onclick="addNewTab()">+</button>
        </div>
        <div id="editor-area">
            <textarea id="code-editor"></textarea>
            <button class="run-btn" onclick="startRun()">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="white"><path d="M8 5v14l11-7z"/></svg>
            </button>
        </div>
        <div class="bottom-tools">
            <button class="tool-btn" onclick="exec('selectAll')">Select All</button>
            <button class="tool-btn" onclick="copy()">Copy</button>
            <button class="tool-btn" onclick="paste()">Paste</button>
            <button class="tool-btn" onclick="clearCode()">Clear</button>
        </div>
    </div>

    <!-- FULL SCREEN RUNNER -->
    <div id="run-overlay">
        <!-- Trigger Zone (Top Middle) -->
        <div class="menu-trigger-zone" onclick="toggleMenu(true)">
            <div class="menu-handle"></div>
        </div>

        <iframe id="output-frame"></iframe>
        
        <div class="backdrop" id="backdrop" onclick="toggleMenu(false)"></div>
        
        <div class="control-panel" id="c-panel">
            <div style="text-align:center; font-weight:bold; margin-bottom:5px;">Options</div>
            <select id="tab-list" onchange="runTab(this.value)"></select>
            <div class="btn-row">
                <button class="c-btn bg-blue" onclick="toggleConsole()">Console</button>
                <button class="c-btn bg-red" onclick="closeRun()">EXIT</button>
            </div>
            <div id="console-box"></div>
        </div>
    </div>

    <script>
        let tabs = [], activeId = 1, editor;

        window.onload = function() {
            editor = CodeMirror.fromTextArea(document.getElementById('code-editor'), { mode: "htmlmixed", lineNumbers: true });
            editor.on("change", () => {
                let t = tabs.find(x => x.id == activeId);
                if(t) { t.code = editor.getValue(); localStorage.setItem('runTabs', JSON.stringify(tabs)); }
            });
            let d = localStorage.getItem('runTabs');
            tabs = d ? JSON.parse(d) : [{id:1, name:'File 1', code:''}];
            if(tabs.length === 0) tabs = [{id:1, name:'File 1', code:''}];
            activeId = tabs[0].id;
            renderTabs();
            editor.setValue(tabs[0].code);
        }

        function addNewTab() {
            let id = Date.now();
            tabs.push({id, name: `File ${tabs.length+1}`, code: ''});
            switchTab(id);
        }
        function switchTab(id) {
            activeId = id;
            editor.setValue(tabs.find(x => x.id == id).code || "");
            editor.clearHistory();
            renderTabs();
        }
        function renderTabs() {
            let h = '';
            tabs.forEach(t => h += `<div class="tab-chip ${t.id==activeId?'active':''}" onclick="switchTab(${t.id})">${t.name} <span style="margin-left:5px" onclick="delTab(event,${t.id})">&times;</span></div>`);
            document.getElementById('tabs-container').innerHTML = h;
        }
        function delTab(e, id) { e.stopPropagation(); if(tabs.length>1) { tabs = tabs.filter(t=>t.id!=id); switchTab(tabs[0].id); } }
        
        function exec(c) { editor.execCommand(c); }
        function copy() { navigator.clipboard.writeText(editor.getValue()); }
        function paste() { navigator.clipboard.readText().then(t=>editor.replaceSelection(t)); }
        function clearCode() { editor.setValue(""); }

        // RUN LOGIC
        function startRun() {
            document.getElementById('run-overlay').style.display = 'block';
            let sel = document.getElementById('tab-list'); sel.innerHTML = "";
            tabs.forEach(t => sel.innerHTML += `<option value="${t.id}" ${t.id==activeId?'selected':''}>${t.name}</option>`);
            runTab(activeId);
            
            // HTML API for Fullscreen
            let elem = document.documentElement;
            if(elem.requestFullscreen) elem.requestFullscreen();
        }

        function runTab(id) {
            let t = tabs.find(x=>x.id==id);
            let frame = document.getElementById('output-frame');
            document.getElementById('console-box').innerHTML = "";
            
            let script = `<script>
                window.onerror = function(m,u,l){ parent.postMessage({type:'err',m:m,l:l},'*'); };
                const _l=console.log; console.log=function(...a){ parent.postMessage({type:'log',m:a.join(' ')},'*'); _l.apply(console,a); };
            <\/script>`;
            
            let blob = new Blob([script + (t?t.code:'')], {type:'text/html'});
            frame.src = URL.createObjectURL(blob);
            toggleMenu(false);
        }

        function toggleMenu(s) {
            document.getElementById('c-panel').className = s ? 'control-panel show' : 'control-panel';
            document.getElementById('backdrop').style.display = s ? 'block' : 'none';
        }
        function closeRun() {
            document.getElementById('run-overlay').style.display = 'none';
            document.getElementById('output-frame').src = "about:blank";
            if(document.exitFullscreen) document.exitFullscreen();
        }
        function toggleConsole() {
            let b = document.getElementById('console-box');
            b.style.display = b.style.display=='block'?'none':'block';
        }
        window.addEventListener('message', e => {
            let b = document.getElementById('console-box');
            let c = e.data.type=='err'?'red':'lime';
            b.innerHTML += `<div style="color:${c}">> ${e.data.m}</div>`;
        });
    </script>
</body>
</html>
