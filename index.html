<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Multi-Tasking Pro IDE</title>
    
    <!-- CodeMirror Assets -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/theme/material-darker.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/mode/htmlmixed/htmlmixed.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/mode/xml/xml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.12/mode/css/css.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root { --bg: #09090b; --panel: #18181b; --accent: #10b981; --text: #e4e4e7; --danger: #ef4444; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg); color: var(--text); font-family: sans-serif; overflow: hidden; }

        /* 🔥 HEADER FIXED LAYOUT 🔥 */
        .ide-wrapper {
            display: grid;
            grid-template-rows: auto auto 1fr;
            height: 100vh;
            width: 100vw;
        }

        header { background: var(--panel); border-bottom: 1px solid #27272a; z-index: 50; }
        .toolbar { height: 55px; display: flex; align-items: center; padding: 0 10px; gap: 8px; }
        .icon-btn { background: #27272a; border: none; color: var(--text); padding: 10px; border-radius: 6px; cursor: pointer; font-size: 15px; transition: 0.2s; }
        .btn-run { background: var(--accent); color: #fff; font-weight: bold; flex: 1; border: none; border-radius: 6px; height: 38px; text-transform: uppercase; font-size: 13px; }

        .tab-bar { display: flex; background: #000; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid #27272a; }
        .tab { padding: 12px 18px; font-size: 12px; cursor: pointer; border-right: 1px solid #18181b; white-space: nowrap; color: #71717a; display: flex; align-items: center; gap: 6px; }
        .tab.active { background: var(--bg); color: var(--accent); border-bottom: 2px solid var(--accent); }

        /* EDITOR */
        .editor-zone { position: relative; background: var(--bg); height: 100%; overflow: hidden; }
        .CodeMirror { height: 100% !important; font-size: 16px; background: transparent !important; }

        /* 🔥 PREVIEW OVERLAY 🔥 */
        #preview-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #fff; z-index: 1000; }
        
        /* Iframe Container for Multi-Tasking */
        #iframe-container { width: 100%; height: 100%; position: relative; }
        .app-frame { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; display: none; background: white; }
        .app-frame.active { display: block; }

        /* Minimal Float UI */
        #menu-btn { position: absolute; top: 15px; left: 15px; width: 32px; height: 32px; background: rgba(0,0,0,0.3); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #fff; z-index: 1100; opacity: 0.5; }
        #menu-card { display: none; position: absolute; top: 55px; left: 15px; width: 200px; background: #18181b; border: 1px solid #3f3f46; border-radius: 12px; padding: 12px; z-index: 1101; box-shadow: 0 10px 40px rgba(0,0,0,0.7); }
        .m-btn { width: 100%; background: #27272a; border: none; color: #fff; padding: 10px; border-radius: 8px; margin-bottom: 6px; font-size: 12px; text-align: left; }
    </style>
</head>
<body>

<div class="ide-wrapper">
    <header>
        <div class="toolbar">
            <button class="icon-btn" onclick="clearCode()"><i class="fa-solid fa-trash-can"></i></button>
            <button class="icon-btn" onclick="pasteCode()"><i class="fa-solid fa-paste"></i></button>
            <button class="icon-btn" onclick="copyCode()"><i class="fa-solid fa-copy"></i></button>
            <button class="icon-btn" onclick="addNewTab()"><i class="fa-solid fa-plus"></i></button>
            <button class="btn-run" onclick="openRunner()"><i class="fa-solid fa-play"></i> RUN ENGINE</button>
        </div>
        <div class="tab-bar" id="tab-bar"></div>
    </header>

    <div class="editor-zone">
        <textarea id="main-editor"></textarea>
    </div>
</div>

<div id="preview-overlay">
    <div id="menu-btn" onclick="toggleMenu()"><i class="fa-solid fa-bars-staggered"></i></div>
    <div id="menu-card">
        <button class="m-btn" onclick="rotateScr()">🔄 Rotate</button>
        <button class="m-btn" onclick="fullScr()">⛶ Fullscreen</button>
        <button class="m-btn" style="color:var(--danger)" onclick="exitRunner()">✕ Exit Engine</button>
        <div style="font-size: 10px; color: #52525b; margin: 10px 0 5px;">ACTIVE SESSIONS (NO RELOAD)</div>
        <div id="active-app-list"></div>
    </div>
    <div id="iframe-container"></div>
</div>

<script>
    let editor, activeId, saveTimer;
    let lastTap = 0;
    let files = JSON.parse(localStorage.getItem('pro_task_v14')) || [{ id: 101, name: 'index.html', content: '<h1>Multi-Tasking Engine</h1>' }];
    activeId = files[0].id;

    window.onload = () => {
        editor = CodeMirror.fromTextArea(document.getElementById('main-editor'), {
            mode: "htmlmixed", theme: "material-darker", lineNumbers: true, lineWrapping: true,
            inputStyle: "contenteditable", viewportMargin: 10
        });

        editor.on('change', () => {
            clearTimeout(saveTimer);
            saveTimer = setTimeout(() => {
                let f = files.find(x => x.id === activeId);
                if(f) f.content = editor.getValue();
                localStorage.setItem('pro_task_v14', JSON.stringify(files));
            }, 800);
        });

        // Double Tap Fullscreen for Main IDE
        document.body.addEventListener('click', (e) => {
            let now = Date.now();
            if (now - lastTap < 300) {
                if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
                else document.exitFullscreen().catch(()=>{});
            }
            lastTap = now;
        });

        renderTabs();
        loadTab(activeId);
    };

    function renderTabs() {
        const bar = document.getElementById('tab-bar');
        bar.innerHTML = "";
        files.forEach(f => {
            const t = document.createElement('div');
            t.className = `tab ${f.id === activeId ? 'active' : ''}`;
            t.innerHTML = `${f.name} <span onclick="deleteTab(${f.id}, event)" style="margin-left:8px">×</span>`;
            t.onclick = () => loadTab(f.id);
            bar.appendChild(t);
        });
    }

    function loadTab(id) {
        activeId = id;
        const f = files.find(x => x.id === id);
        editor.setValue(f.content);
        renderTabs();
        
        // যদি রান স্ক্রিন খোলা থাকে, তবে ঐ ট্যাবের আইফ্রেম দেখাও (নতুন করে লোড হবে না)
        if(document.getElementById('preview-overlay').style.display === 'block') {
            showFrame(id);
        }
    }

    function addNewTab() {
        let n = prompt("File Name:", "app.html");
        if(n) {
            let id = Date.now();
            files.push({ id: id, name: n, content: "<!-- Isolated App -->" });
            loadTab(id);
        }
    }

    function deleteTab(id, e) {
        e.stopPropagation(); if(files.length === 1) return;
        files = files.filter(x => x.id !== id);
        const frame = document.getElementById('frame-' + id);
        if(frame) frame.remove();
        if(activeId === id) loadTab(files[0].id); else renderTabs();
    }

    // 🔥 THE MULTI-TASKING RUN ENGINE 🔥
    function openRunner() {
        document.getElementById('preview-overlay').style.display = 'block';
        showFrame(activeId, true); // true মানে এটি যদি প্রথমবার হয় তবে ইনজেক্ট করো
    }

    function showFrame(id, forceUpdate = false) {
        const container = document.getElementById('iframe-container');
        let frame = document.getElementById('frame-' + id);

        // সব ফ্রেম হাইড করো
        document.querySelectorAll('.app-frame').forEach(f => f.classList.remove('active'));

        if (!frame) {
            // নতুন ফ্রেম তৈরি করো (প্রথমবার রান করলে)
            frame = document.createElement('iframe');
            frame.id = 'frame-' + id;
            frame.className = 'app-frame active';
            frame.allow = "autoplay; gyroscope; accelerometer; pointer-lock; vibrate";
            container.appendChild(frame);
            injectCode(frame, id);
        } else {
            // যদি ফ্রেম আগে থেকেই থাকে, তবে শুধু শো করো (রিলোড হবে না)
            frame.classList.add('active');
            if(forceUpdate) injectCode(frame, id); // যদি রান বাটনে আবার ক্লিক করেন তবেই আপডেট হবে
        }

        updateMenu();
    }

    function injectCode(iframe, id) {
        const f = files.find(x => x.id === id);
        const sessionKey = "sess_" + id;

        const isolation = `
        <script>
            (function() {
                const ID = "${sessionKey}";
                const wrap = (t) => {
                    const o = window[t];
                    return {
                        getItem: (k) => JSON.parse(o.getItem(ID) || "{}")[k] || null,
                        setItem: (k, v) => {
                            const d = JSON.parse(o.getItem(ID) || "{}");
                            d[k] = v; o.setItem(ID, JSON.stringify(d));
                        },
                        removeItem: (k) => {
                            const d = JSON.parse(o.getItem(ID) || "{}");
                            delete d[k]; o.setItem(ID, JSON.stringify(d));
                        },
                        clear: () => o.removeItem(ID)
                    };
                };
                Object.defineProperty(window, 'localStorage', { value: wrap('localStorage') });
                Object.defineProperty(window, 'sessionStorage', { value: wrap('sessionStorage') });
                
                // Alert/Confirm Fix
                window.alert = (m) => {
                    const d = document.createElement('div');
                    d.style = "position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#18181b;color:#fff;padding:20px;border:1px solid #10b981;border-radius:12px;z-index:999999;text-align:center;box-shadow:0 0 50px #000;";
                    d.innerHTML = "<p>"+m+"</p><button id='v_ok' style='background:#10b981;border:none;padding:8px 20px;border-radius:6px;color:#fff;font-weight:bold;'>OK</button>";
                    document.body.appendChild(d);
                    document.getElementById('v_ok').onclick = () => document.body.removeChild(d);
                };
            })();
        <\/script>`;

        iframe.srcdoc = isolation + f.content;
    }

    function updateMenu() {
        const list = document.getElementById('active-app-list');
        list.innerHTML = "";
        files.forEach(f => {
            const b = document.createElement('button');
            b.className = `m-btn ${f.id === activeId ? 'active' : ''}`;
            if(f.id === activeId) b.style.borderColor = "#10b981";
            b.innerText = "📁 " + f.name;
            b.onclick = () => loadTab(f.id);
            list.appendChild(b);
        });
    }

    function toggleMenu() {
        const m = document.getElementById('menu-card');
        m.style.display = m.style.display === 'block' ? 'none' : 'block';
    }

    function exitRunner() {
        document.getElementById('preview-overlay').style.display = 'none';
        // রানার থেকে বের হলে আইফ্রেম ডিলিট হবে না, জাস্ট হাইড হবে (টাস্ক সেভ থাকবে)
    }

    function fullScr() {
        let p = document.getElementById('preview-overlay');
        if(!document.fullscreenElement) p.requestFullscreen().catch(()=>{});
        else document.exitFullscreen();
    }

    function rotateScr() {
        if(screen.orientation && screen.orientation.lock) {
            if(screen.orientation.type.includes('portrait')) screen.orientation.lock('landscape').catch(()=>{});
            else screen.orientation.lock('portrait').catch(()=>{});
        }
    }

    function clearCode() { if(confirm("Clear Tab?")) editor.setValue(""); }
    async function pasteCode() { editor.replaceSelection(await navigator.clipboard.readText()); editor.focus(); }
    function copyCode() { navigator.clipboard.writeText(editor.getValue()); alert("Copied!"); }
</script>
</body>
</html>
