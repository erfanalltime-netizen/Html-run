<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ultimate Fullscreen Runner</title>
    <style>
        /* CSS Reset for Full Screen */
        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
        }

        /* Toolbar */
        .toolbar {
            display: flex;
            background: #161b22;
            padding: 10px;
            gap: 10px;
            height: 65px;
            align-items: center;
            border-bottom: 2px solid #30363d;
        }

        .btn {
            border: none;
            height: 45px;
            padding: 0 15px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            border-radius: 8px;
            color: white;
            transition: 0.2s;
            text-transform: uppercase;
        }

        .btn-clear { background: #e74c3c; }
        .btn-paste { background: #3498db; }
        .btn-run { background: #2ecc71; flex-grow: 1; font-size: 15px; }

        .btn:active { transform: scale(0.95); opacity: 0.8; }

        /* Editor */
        #editor {
            width: 100%;
            height: calc(100% - 65px);
            background: #0d1117;
            color: #79c0ff;
            padding: 15px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 16px;
            border: none;
            outline: none;
            resize: none;
            line-height: 1.5;
        }

        /* Real Full Screen Output Container */
        #output-container {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: #000;
            z-index: 999999;
            margin: 0; padding: 0;
        }

        iframe {
            width: 100%; height: 100%;
            border: none;
            margin: 0; padding: 0;
            display: block;
        }
    </style>
</head>
<body>

    <div class="toolbar">
        <button class="btn btn-clear" onclick="clearCode()">Clear</button>
        <button class="btn btn-paste" onclick="pasteCode()">Paste</button>
        <button class="btn btn-run" onclick="runApp()">Run Fullscreen</button>
    </div>

    <textarea id="editor" spellcheck="false" placeholder="Write or Paste your code here..."></textarea>

    <!-- Output UI -->
    <div id="output-container">
        <iframe id="output-frame" allow="autoplay; fullscreen; gyroscope; accelerometer;"></iframe>
    </div>

    <script>
        const editor = document.getElementById('editor');
        const container = document.getElementById('output-container');
        const iframe = document.getElementById('output-frame');

        // ১. ফিক্সড পেস্ট ফাংশন
        async function pasteCode() {
            try {
                // আধুনিক ব্রাউজারে ক্লিপবোর্ড থেকে ডাটা নেয়া
                const text = await navigator.clipboard.readText();
                if (text) {
                    const start = editor.selectionStart;
                    const end = editor.selectionEnd;
                    editor.value = editor.value.substring(0, start) + text + editor.value.substring(end);
                    editor.focus();
                }
            } catch (err) {
                alert("Paste failed! Please allow clipboard permission in browser settings.");
            }
        }

        // ২. ফিক্সড রান এবং রোটেশন ফাংশন
        async function runApp() {
            const code = editor.value;
            if(!code.trim()) return;

            // আইফ্রেমে কোড সেট করা
            const doc = iframe.contentWindow.document;
            doc.open();
            doc.write(code);
            doc.close();

            container.style.display = "block";

            try {
                // ফুলস্ক্রিন রিকোয়েস্ট (Browser compatibility)
                if (container.requestFullscreen) {
                    await container.requestFullscreen();
                } else if (container.webkitRequestFullscreen) {
                    await container.webkitRequestFullscreen();
                }

                // ৩. রোটেশন ফিক্স (lock 'any' ব্যবহার করা হয়েছে যা অটো ঘুরাবে)
                if (screen.orientation && screen.orientation.lock) {
                    await screen.orientation.lock('any').catch(e => {
                        console.log("Orientation lock not supported or failed.");
                    });
                }
            } catch (err) {
                console.log("Full screen mode failed:", err);
            }
        }

        // ৪. ক্লিয়ার ফাংশন
        function clearCode() {
            if(confirm("Are you sure?")) {
                editor.value = "";
                editor.focus();
            }
        }

        // ৫. ফুলস্ক্রিন থেকে বের হলে ক্লিনিং
        function exitHandler() {
            if (!document.fullscreenElement && !document.webkitIsFullScreen) {
                container.style.display = "none";
                iframe.src = "about:blank"; // মেমোরি ক্লিয়ার করা
                
                // রোটেশন আনলক করা যাতে নরমাল মোডে ফিরে আসে
                if (screen.orientation && screen.orientation.unlock) {
                    screen.orientation.unlock();
                }
            }
        }

        document.addEventListener('fullscreenchange', exitHandler);
        document.addEventListener('webkitfullscreenchange', exitHandler);
    </script>
</body>
</html>
