<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- viewport-fit=cover অংশটি Notch ডিসপ্লের গ্যাপ দূর করবে -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Edge-to-Edge Code Runner</title>
    <style>
        * { box-sizing: border-box; }
        
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: sans-serif;
            overflow: hidden;
        }

        /* Toolbar Area */
        .toolbar {
            display: flex;
            background: #161b22;
            padding: 10px;
            gap: 8px;
            height: 60px;
            align-items: center;
            border-bottom: 1px solid #30363d;
        }

        .btn {
            border: none;
            height: 40px;
            padding: 0 15px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            border-radius: 6px;
            color: white;
            text-transform: uppercase;
        }

        .btn-clear { background: #da3633; }
        .btn-paste { background: #1f6feb; }
        .btn-run { background: #238636; flex-grow: 1; font-size: 14px; }

        /* Editor Area */
        #editor {
            width: 100%;
            height: calc(100% - 60px);
            background: #0d1117;
            color: #79c0ff;
            padding: 15px;
            font-family: 'Consolas', monospace;
            font-size: 16px;
            border: none;
            outline: none;
            resize: none;
        }

        /* 🔥 Full Screen Output Container 🔥 */
        #output-container {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100vw;
            height: 100vh;
            background: #000; /* একদম কালো ব্যাকগ্রাউন্ড যাতে গ্যাপ না বোঝা যায় */
            z-index: 999999;
            margin: 0;
            padding: 0;
            border: none;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            margin: 0;
            padding: 0;
            display: block; /* নিচের এক্সট্রা স্পেস রিমুভ করবে */
        }
    </style>
</head>
<body>

    <div class="toolbar">
        <button class="btn btn-clear" onclick="clearCode()">Clear</button>
        <button class="btn btn-paste" onclick="pasteCode()">Paste</button>
        <button class="btn btn-run" onclick="runApp()">RUN FULLSCREEN</button>
    </div>

    <textarea id="editor" spellcheck="false" placeholder="Write or Paste your HTML here..."></textarea>

    <!-- Fullscreen Container -->
    <div id="output-container">
        <iframe id="output-frame" allow="autoplay; fullscreen; gyroscope; accelerometer;"></iframe>
    </div>

    <script>
        const editor = document.getElementById('editor');
        const container = document.getElementById('output-container');
        const iframe = document.getElementById('output-frame');

        // ১. পেস্ট ফাংশন
        async function pasteCode() {
            try {
                const text = await navigator.clipboard.readText();
                editor.value += text;
            } catch (err) {
                alert("Please allow clipboard access or paste manually.");
            }
        }

        // ২. রান ফাংশন (Real Fullscreen)
        async function runApp() {
            const code = editor.value;
            if(!code.trim()) return;

            // আইফ্রেমে কোড সেট করা
            const doc = iframe.contentWindow.document;
            doc.open();
            doc.write(code);
            doc.close();

            container.style.display = "block";

            // ফুলস্ক্রিন রিকোয়েস্ট (সব ব্রাউজারের জন্য)
            const elem = container;
            if (elem.requestFullscreen) {
                await elem.requestFullscreen();
            } else if (elem.webkitRequestFullscreen) { /* Safari/Chrome Mobile */
                await elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) {
                await elem.msRequestFullscreen();
            }

            // রোটেশন অটো-ডিটেকশন ফিক্স
            if (screen.orientation && screen.orientation.unlock) {
                try {
                    await screen.orientation.unlock(); 
                } catch(e) { 
                    console.log("Rotation unlock failed");
                }
            }
        }

        // ৩. ক্লিয়ার ফাংশন
        function clearCode() {
            if(confirm("Clear Code?")) {
                editor.value = "";
            }
        }

        // ৪. ফুলস্ক্রিন থেকে বের হলে এডিটরে ফেরা
        function exitHandler() {
            if (!document.fullscreenElement && 
                !document.webkitIsFullScreen && 
                !document.mozFullScreen && 
                !document.msFullscreenElement) {
                container.style.display = "none";
                iframe.src = "about:blank"; // মেমোরি ক্লিয়ার
            }
        }

        document.addEventListener('fullscreenchange', exitHandler);
        document.addEventListener('webkitfullscreenchange', exitHandler);
        document.addEventListener('mozfullscreenchange', exitHandler);
        document.addEventListener('MSFullscreenChange', exitHandler);

    </script>
</body>
</html>
